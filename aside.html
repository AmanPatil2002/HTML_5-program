<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        <aside>:
        - Represents a section of the page with related content, often tangential to the main content.
        - Common uses: sidebars, pull quotes, lists of links, filters, or a group of controls.
    -->
    <aside>
        <input type="radio" name="abc">Men
        <input type="radio" name="abc">Women
        <input type="radio" name="abc">Kids
        <input type="radio" name="abc">Girls
        <input type="radio" name="abc">Home Decor
    </aside>
</body>
</html>
